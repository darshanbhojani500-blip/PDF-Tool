<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Q&A Snap</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#dde0e6;--acc:#0e6b62;--acc-ink:#fff;--mark:#fff0a8;--danger:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1d232d;--ink:#e8ebf0;--mute:#9aa4b2;--line:#2e3644;--acc:#4fd1c0;--acc-ink:#0b1d1a;--mark:#4a4220;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#14181f;--card:#1d232d;--ink:#e8ebf0;--mute:#9aa4b2;--line:#2e3644;--acc:#4fd1c0;--acc-ink:#0b1d1a;--mark:#4a4220;--danger:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.app{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto}
button,input,select{font-family:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);min-height:40px;min-width:40px;padding:0 12px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.d{color:var(--danger)}
.btn.s{min-height:34px;font-size:14px;padding:0 10px}
select,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:40px;padding:0 10px;max-width:100%}
.top{padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--line);padding:3px;border-radius:10px}
.seg button{border:0;background:none;min-height:34px;padding:0 14px;border-radius:8px;font-weight:600;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.15)}
#target,#lfilter{flex:1;min-width:0}
#pdfsel{flex:1;min-width:0}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;overflow:auto;background:#8d949e;text-align:center;padding:6px;-webkit-overflow-scrolling:touch}
#pg{position:relative;display:inline-block;line-height:0;background:#fff;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#pg.move{touch-action:auto;cursor:grab}
#cv{display:block}
#selbox{position:absolute;border:2px solid #0e6b62;background:rgba(14,107,98,.2);display:none;pointer-events:none}
.hlb{position:absolute;pointer-events:none}
.hlb.q{border:2px solid #2563eb;background:rgba(37,99,235,.14)}
.hlb.a{border:2px solid #16a34a;background:rgba(22,163,74,.14)}
.empty{color:var(--mute);text-align:center;padding:36px 14px;margin:10px;border:1px dashed var(--line);border-radius:12px}
#stage .empty{background:var(--card)}
.bottom{display:flex;gap:6px;padding:8px 10px;background:var(--card);border-top:1px solid var(--line);align-items:center;justify-content:space-between}
.bottom input{width:54px;text-align:center;padding:0 4px}
#ptot{color:var(--mute);font-size:14px;white-space:nowrap}
#saved{flex:1;min-height:0;overflow:auto;padding:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.item img{max-width:100%;display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
.item img+img{margin-top:6px}
.cap{font-weight:700;font-size:13px;color:var(--mute);margin:8px 0 4px}
.cap:first-child{margin-top:0}
.meta{display:flex;gap:6px;margin-top:10px;align-items:center}
.meta select{flex:1;min-width:0;min-height:36px;font-size:14px}
.hint{color:var(--mute);font-size:14px;margin:6px 0}
.toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:460px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 14px;border-radius:12px;display:flex;align-items:center;gap:10px;justify-content:space-between;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;font-weight:600}
.toast.on{opacity:1;pointer-events:auto}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;min-height:32px;padding:0 12px;font-weight:700}
#focus,#unfocus{display:none}
#unfocus{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:76px;z-index:25;min-height:34px;font-size:14px;opacity:.92}
#stage{min-width:0}
@media (orientation:landscape) and (max-height:600px){
  .top{flex-direction:row;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:4px 8px;gap:8px}
  .top .row{flex-wrap:nowrap;flex:none}
  .top .btn,.top select,.top input[type=text]{min-height:34px}
  .seg button{min-height:30px}
  #target{width:200px;flex:none}
  #pdfsel{width:170px;flex:none}
  #view{flex-direction:row}
  .bottom{flex-direction:column;width:64px;flex:none;border-top:0;border-left:1px solid var(--line);padding:6px;gap:4px;justify-content:flex-start;overflow-y:auto}
  .bottom .btn{min-height:34px;width:100%;padding:0}
  .bottom input{width:100%;min-height:32px;padding:0}
  #ptot{font-size:11px;text-align:center;width:100%}
  #focus{display:block}
  .app.focus .top{display:none}
  .app.focus ~ #unfocus{display:block}
  .toast{bottom:12px;left:12px;right:84px}
}
#view{position:relative}
#ann{position:absolute;left:0;top:0;pointer-events:none}
#txtbar{position:absolute;left:8px;right:8px;top:56px;z-index:14;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#txtbar input{width:100%}
#tools{position:absolute;right:8px;bottom:8px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 4px 18px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px;max-width:270px}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg .btn{min-height:38px;font-size:14px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.sw.sel{outline:3px solid var(--ink);outline-offset:1px}
@media (orientation:landscape) and (max-height:600px){#txtbar{right:78px}#tools{right:78px;bottom:8px}}
#fab{position:absolute;left:8px;top:8px;z-index:12;display:flex;gap:6px}
#fab .btn{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.3);min-width:44px;font-size:20px;padding:0 10px}
.btn:disabled{opacity:.4;cursor:default}
.app.focus .top{display:none}
[hidden]{display:none!important}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e6b62">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Q&amp;A Snap">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="row">
      <div class="seg" role="tablist"><button role="tab" id="t1" aria-selected="true">Read</button><button role="tab" id="t2" aria-selected="false">Saved <span id="cnt"></span></button></div>
      <button class="btn p" id="openpdf">Open PDF</button>
      <select id="pdfsel" aria-label="Recent PDFs" hidden></select>
      <input type="file" id="fpdf" accept="application/pdf" hidden>
    </div>
    <div class="row" id="r2">
      <select id="target" aria-label="Save snips to topic"></select>
      <button class="btn" id="newt" aria-label="New subject or topic">+</button>
      <button class="btn" id="pairb">Single snips</button>
      <button class="btn" id="gal">Gallery on</button>
    </div>
    <div class="row" id="qf" hidden>
      <input type="text" id="qs" list="sdl" placeholder="Subject" style="flex:1;min-width:120px">
      <datalist id="sdl"></datalist>
      <input type="text" id="qt" placeholder="Topic" style="flex:1;min-width:120px">
      <button class="btn p" id="qgo">Use</button>
    </div>
    <p class="hint" id="dbwarn" hidden style="margin:0">Saving isn’t available in this view, so make your PDF before closing the page.</p>
  </div>

  <div id="view">
    <div id="stage">
      <div class="empty" id="noPdf">Tap <b>Open PDF</b> to start. Then drag a box over the part you want to keep.</div>
      <div id="pg" hidden><canvas id="cv"></canvas><canvas id="ann"></canvas><div id="selbox"></div></div>
    </div>
    <div id="fab"><button class="btn" id="undo" aria-label="Undo mark" disabled>↶</button><button class="btn" id="redo" aria-label="Redo mark" disabled>↷</button><button class="btn" id="vw" aria-label="Switch to the other copy of the PDF" title="Switch copy (or swipe or tap with 3 fingers)">1</button><button class="btn" id="fs" aria-label="Full screen">⛶</button></div>
    <div id="txtbar" hidden><input type="text" id="txtin" placeholder="Type your note, then tap the page"></div>
    <div id="tools" hidden>
      <div class="tg">
        <button class="btn" data-t="snip">Snip</button><button class="btn on" data-t="move">Move</button><button class="btn" data-t="hl">Highlight</button>
        <button class="btn" data-t="box">Box</button><button class="btn" data-t="arrow">Arrow</button><button class="btn" data-t="text">Text</button>
      </div>
      <div class="tg" id="sw" hidden>
        <button class="sw" data-c="#facc15" style="background:#facc15" aria-label="Yellow"></button>
        <button class="sw" data-c="#e11d48" style="background:#e11d48" aria-label="Red"></button>
        <button class="sw" data-c="#2563eb" style="background:#2563eb" aria-label="Blue"></button>
        <button class="sw" data-c="#16a34a" style="background:#16a34a" aria-label="Green"></button>
      </div>
      <div class="tg" id="thk" hidden><span class="hint" style="margin:0;align-self:center">Line</span><button class="btn" data-th=".012">Thin</button><button class="btn on" data-th=".018">Medium</button><button class="btn" data-th=".026">Thick</button></div>
      <div class="tg"><button class="btn d" id="mclear">Clear page</button></div>
    </div>
    <div class="bottom" id="bar">
      <button class="btn" id="prev" aria-label="Previous page">◀</button>
      <input type="number" id="pno" min="1" value="1" aria-label="Page"><span id="ptot"></span>
      <button class="btn" id="next" aria-label="Next page">▶</button>
      <button class="btn" id="zo" aria-label="Zoom out">−</button>
      <button class="btn" id="zi" aria-label="Zoom in">+</button>
      <button class="btn" id="mode">Move</button>
    </div>
  </div>

  <div id="saved" hidden>
    <div class="row">
      <select id="lfilter" aria-label="Show topic"></select>
      <button class="btn p" id="mk">Save all to gallery</button>
    </div>
    <p class="hint" id="mkst"></p>
    <div id="list"></div>
    <div id="pdfs"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tundo" hidden>Undo</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},db=null,armed=null,armT;
var S={subjects:[],items:[],cur:{sid:"",tid:""},pdfs:[]};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var undoFn=null;
function toast(m,undo){
  $("tmsg").textContent=m;undoFn=undo||null;$("tundo").hidden=!undo;$("toast").classList.add("on");
  clearTimeout(toast.h);toast.h=setTimeout(function(){$("toast").classList.remove("on");undoFn=null},undo?5000:1800);
}
$("tundo").onclick=function(){if(undoFn)undoFn();undoFn=null;$("toast").classList.remove("on")};

/* ---------- storage ---------- */
function openDb(){return new Promise(function(res){try{var r=indexedDB.open("qasnap2",1);r.onupgradeneeded=function(){r.result.createObjectStore("s");r.result.createObjectStore("pdfs")};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function dget(st,k){return new Promise(function(res){if(!db)return res(null);try{var q=db.transaction(st).objectStore(st).get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}}catch(e){res(null)}})}
function dput(st,k,v){if(!db)return;try{db.transaction(st,"readwrite").objectStore(st).put(v,k)}catch(e){}}
function ddel(st,k){if(!db)return;try{db.transaction(st,"readwrite").objectStore(st).delete(k)}catch(e){}}
function persist(){dput("s","state",S)}

/* ---------- subjects / topics ---------- */
function ensure(sn,tn){sn=sn.trim();tn=(tn||"").trim()||"General";
  var s=S.subjects.filter(function(x){return x.name.toLowerCase()===sn.toLowerCase()})[0];
  if(!s){s={id:uid(),name:sn,topics:[]};S.subjects.push(s)}
  var t=s.topics.filter(function(x){return x.name.toLowerCase()===tn.toLowerCase()})[0];
  if(!t){t={id:uid(),name:tn};s.topics.push(t)}
  return{sid:s.id,tid:t.id}}
function subj(id){return S.subjects.filter(function(s){return s.id===id})[0]}
function topicOf(i){var s=subj(i.sid);return s?s.topics.filter(function(t){return t.id===i.tid})[0]:null}
function fullName(i){var s=subj(i.sid),t=topicOf(i);return s&&t?s.name+" › "+t.name:"Unsorted"}
function opts(all){
  var h=all?'<option value="*">All saved</option>':'';
  h+='<option value="|">Unsorted</option>';
  S.subjects.forEach(function(s){
    if(all)h+='<option value="'+s.id+'|">'+esc(s.name)+' (all)</option>';
    h+='<optgroup label="'+esc(s.name)+'">'+s.topics.map(function(t){return'<option value="'+s.id+'|'+t.id+'">'+esc(t.name)+'</option>'}).join("")+'</optgroup>';
  });return h}
function match(i,v){if(v==="*")return true;var p=v.split("|");return p[0]===i.sid&&(!p[1]||p[1]===i.tid)}
function setSel(el,v,fb){el.value=v;if(el.value!==v)el.value=fb}
function norm(){S.items.forEach(function(it){if(!it.q){var im=it.imgs||[];it.q=im.length?[im[0]]:[];it.a=im[1]?[im[1]]:[];it.one=im.length===1}it.a=it.a||[];it.srcQ=it.srcQ||[];it.srcA=it.srcA||[]})}
function arm(k){armed=k;clearTimeout(armT);armT=setTimeout(function(){armed=null;renderList()},3000)}
function btnLbl(k,t){return armed===k?"Tap again":t}

function refresh(){
  var lv=$("lfilter").value||"*";
  $("target").innerHTML=opts(false);setSel($("target"),S.cur.sid+"|"+S.cur.tid,"|");
  $("lfilter").innerHTML=opts(true);setSel($("lfilter"),lv,"*");
  $("sdl").innerHTML=S.subjects.map(function(s){return'<option value="'+esc(s.name)+'">'}).join("");
  $("cnt").textContent=S.items.length?"("+S.items.length+")":"";
  renderList();
}
$("target").onchange=function(){var p=this.value.split("|");S.cur={sid:p[0],tid:p[1]||""};persist()};
$("newt").onclick=function(){$("qf").hidden=!$("qf").hidden;if(!$("qf").hidden)$("qs").focus()};
$("qgo").onclick=function(){
  var s=$("qs").value.trim();if(!s){toast("Type a subject first");return}
  S.cur=ensure(s,$("qt").value);$("qs").value="";$("qt").value="";$("qf").hidden=true;persist();refresh();toast("Saving to "+fullName(S.cur));
};

/* ---------- viewer ---------- */
var pdf=null,pdfName="",pdfId=null,page=1,zoom=0,task=null,tok=0,snipOn=true,pair=false,role="q",pend=null,lastQ=null,lastA=null,posT,manual=false;
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
var ann=$("ann"),stage=$("stage"),cv=$("cv"),pgEl=$("pg"),box=$("selbox");
function meta(){return S.pdfs.filter(function(p){return p.id===pdfId})[0]}
function savePos(){var m=meta();if(!m)return;m.pg=page;m.lq=lastQ;m.la=lastA;clearTimeout(posT);posT=setTimeout(persist,800)}
function pdfList(sel){
  var l=S.pdfs;$("pdfsel").hidden=!l.length;
  $("pdfsel").innerHTML='<option value="">Recent PDFs</option>'+l.map(function(p){return'<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join("");
  if(sel)$("pdfsel").value=sel;
}
function drawHl(){
  Array.prototype.slice.call(pgEl.querySelectorAll(".hlb")).forEach(function(e){e.remove()});
  var w=parseFloat(cv.style.width)||cv.width,h=parseFloat(cv.style.height)||cv.height;
  function mk(r,k){if(!r||r.page!==page)return;var d=document.createElement("div");d.className="hlb "+k;d.style.cssText="left:"+r.x*w+"px;top:"+r.y*h+"px;width:"+r.w*w+"px;height:"+r.h*h+"px";pgEl.appendChild(d)}
  S.items.forEach(function(it){if(it.pdf!==pdfId)return;(it.srcQ||[]).forEach(function(r){mk(r,"q")});(it.srcA||[]).forEach(function(r){mk(r,"a")})});
  if(pend)mk(pend.ref,"q");
}
async function show(at){
  if(!pdf)return;var my=++tok,pp=await pdf.getPage(page),v1=pp.getViewport({scale:1});
  if(!zoom)zoom=Math.max(.4,Math.min(3,(stage.clientWidth-14)/v1.width));
  var Q=Math.max(1,Math.min(Math.max(2,window.devicePixelRatio||1),2600/(zoom*v1.width))),vp=pp.getViewport({scale:zoom*Q});
  if(task){try{task.cancel()}catch(e){}}
  cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);cv.style.width=Math.round(v1.width*zoom)+"px";cv.style.height=Math.round(v1.height*zoom)+"px";
  ann.width=cv.width;ann.height=cv.height;ann.style.width=cv.style.width;ann.style.height=cv.style.height;drawAnn();
  $("pno").value=page;$("ptot").textContent="/ "+pdf.numPages;
  stage.scrollLeft=at?at.sx:0;stage.scrollTop=at?at.sy:0;drawHl();
  task=pp.render({canvasContext:cv.getContext("2d"),viewport:vp});
  try{await task.promise}catch(e){}
}
function go(n){if(!pdf)return;page=Math.max(1,Math.min(pdf.numPages,n));show();savePos()}
async function openBuf(buf,name,id){
  if(!window.pdfjsLib){toast("The PDF reader didn’t load. Check your connection and reload.");return false}
  try{pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise}catch(e){toast("Couldn’t open that PDF");return false}
  pdfName=name;pdfId=id;updUR();var m=meta()||{};lastQ=m.lq||null;lastA=m.la||null;pend=null;role="q";pairUi();
  $("noPdf").hidden=true;pgEl.hidden=false;zoom=0;manual=false;page=Math.max(1,Math.min(pdf.numPages,m.pg||1));show();return true;
}
$("openpdf").onclick=function(){$("fpdf").click()};
$("fpdf").onchange=function(){
  var f=this.files[0];this.value="";if(!f)return;var r=new FileReader();
  r.onload=function(){var id=uid();S.pdfs.unshift({id:id,name:f.name});dput("pdfs",id,r.result);persist();pdfList(id);openBuf(r.result,f.name,id);renderPdfs()};
  r.readAsArrayBuffer(f);
};
$("pdfsel").onchange=async function(){
  if(!this.value)return;var id=this.value,b=await dget("pdfs",id),p=S.pdfs.filter(function(x){return x.id===id})[0];
  if(b)openBuf(b,p.name,id);else toast("That PDF isn’t stored on this device");
};
$("prev").onclick=function(){go(page-1)};$("next").onclick=function(){go(page+1)};
$("pno").onchange=function(){go(parseInt(this.value,10)||1)};
function zoomBy(f){if(!pdf)return;manual=true;var sx=stage.scrollLeft,sy=stage.scrollTop,z=Math.max(.3,Math.min(4,(zoom||1)*f));f=z/(zoom||1);zoom=z;show({sx:sx*f,sy:sy*f})}
$("zi").onclick=function(){zoomBy(1.25)};$("zo").onclick=function(){zoomBy(.8)};
$("mode").onclick=function(){$("tools").hidden=!$("tools").hidden};

/* ---------- snipping ---------- */
var st=null,lastE=null,raf=0,tool="move",C={hl:"#facc15",box:"#e11d48",arrow:"#e11d48",text:"#2563eb"};
var TN={snip:"Snip",move:"Move",hl:"Hilite",box:"Box",arrow:"Arrow",text:"Text"};
function pt(e){var b=cv.getBoundingClientRect();return{x:Math.max(0,Math.min(b.width,e.clientX-b.left)),y:Math.max(0,Math.min(b.height,e.clientY-b.top)),W:b.width,H:b.height}}

/* marks (annotations), stored per page as fractions of the page */
function marks(){var m=meta();if(!m)return null;m.marks=m.marks||{};m.marks[page]=m.marks[page]||[];return m.marks[page]}
function marksOf(){var m=meta();return(m&&m.marks&&m.marks[page])||[]}
function drawMark(x,m){
  var W=ann.width,H=ann.height,lw=Math.max(2,W*.004);x.lineWidth=lw;x.lineCap="round";x.lineJoin="round";
